name: Docker build and push

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_REGISTRY: public.ecr.aws
  ECR_REGISTRY_ALIAS: sonicgarden
  ECR_REPOSITORY: ruby

jobs:
  # ruby_version 共通化のためのジョブ
  # 参考: https://docs.github.com/en/actions/how-tos/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow#example-using-an-output-to-define-two-matrices
  define_matrix:
    runs-on: ubuntu-latest
    outputs:
      ruby_versions: ${{ steps.ruby_versions.outputs.ruby_versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Define Ruby versions
        id: ruby_versions
        run: echo "ruby_versions=$(jq -c < ruby_versions.json)" >> "$GITHUB_OUTPUT" # 1行にする必要があるので "jq -c" を実施

  build_and_push:
    timeout-minutes: 30
    needs:
      - define_matrix
    strategy:
      # 全バージョンを一斉に push すると "toomanyrequests: Rate exceeded" で落ちるため、同時実行数を絞る。
      # 参考: https://docs.aws.amazon.com/AmazonECR/latest/public/public-service-quotas.html
      max-parallel: 8
      matrix:
        ruby_version: ${{ fromJSON(needs.define_matrix.outputs.ruby_versions) }}
        platform:
          - { runner: 'linux-arm64-public', arch: 'arm64' }
          - { runner: 'ubuntu-24.04', arch: 'amd64' }
    permissions:
      id-token: write
      contents: read

    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public

      # manifest で結合するため、buildx を利用せずにビルドする
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.platform.arch }}
          push: false
          load: true
          no-cache: true
          build-args: |
            RUBY_VERSION=${{ matrix.ruby_version }}
          provenance: false
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:${{ matrix.ruby_version }}-${{ matrix.platform.arch }}

      - name: Push
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}:${{ matrix.ruby_version }}-${{ matrix.platform.arch }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if docker push "$IMAGE"; then
              exit 0
            fi
            if (( attempt == 5 )); then
              break
            fi
            # スロットリング解消待ち (15s, 30s, 45s, 60s)
            wait=$(( 15 * attempt ))
            echo "::warning::Failed to push ${IMAGE} (attempt ${attempt}/5); retrying in ${wait}s"
            sleep "$wait"
          done
          echo "::error::Failed to push ${IMAGE} after 5 attempts"
          exit 1

  create_manifest:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs:
      - build_and_push
      - define_matrix
    strategy:
      # manifest push も PutImage を消費するため build_and_push と同様に絞る
      max-parallel: 8
      matrix:
        ruby_version: ${{ fromJSON(needs.define_matrix.outputs.ruby_versions) }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public

      - name: Create and push manifest
        env:
          ECR_URL: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REGISTRY_ALIAS }}/${{ env.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          docker manifest create --amend $ECR_URL:${{ matrix.ruby_version }} $ECR_URL:${{ matrix.ruby_version }}-arm64 $ECR_URL:${{ matrix.ruby_version }}-amd64
          docker manifest annotate $ECR_URL:${{ matrix.ruby_version }} $ECR_URL:${{ matrix.ruby_version }}-arm64 --os linux --arch arm64
          docker manifest annotate $ECR_URL:${{ matrix.ruby_version }} $ECR_URL:${{ matrix.ruby_version }}-amd64 --os linux --arch amd64
          for attempt in 1 2 3 4 5; do
            if docker manifest push $ECR_URL:${{ matrix.ruby_version }}; then
              exit 0
            fi
            if (( attempt == 5 )); then
              break
            fi
            wait=$(( 15 * attempt ))
            echo "::warning::Failed to push manifest ${{ matrix.ruby_version }} (attempt ${attempt}/5); retrying in ${wait}s"
            sleep "$wait"
          done
          echo "::error::Failed to push manifest ${{ matrix.ruby_version }} after 5 attempts"
          exit 1

  notify_failure:
    if: failure()
    runs-on: ubuntu-latest
    needs:
      - build_and_push
      - create_manifest
    steps:
      - uses: SonicGarden/world-notify-action@faa8ac028ed166f930564c623cfef5e06a7cc91d # v2.0.0
        with:
          token: ${{ secrets.WORLD_NOTIFY_APP_TOKEN }}
          groupId: ${{ secrets.WORLD_NOTIFY_APP_GROUP_ID }}
          content: |
            ${{ github.event.repository.name }} の ${{ github.workflow }} でエラーが発生しました 😱

            詳細はこちら
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
